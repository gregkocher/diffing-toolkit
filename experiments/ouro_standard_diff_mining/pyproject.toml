[project]
name = "ouro-standard-diff-mining"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "diffing-toolkit",
  "transformers==4.57.6",
  "peft==0.18.1",
  "torch==2.9.0",
  "vllm==0.11.2",
  "nnsight==0.7.0",
  "nnterp==1.3.0",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux'"]

[tool.uv.sources]
diffing-toolkit = { path = "../..", editable = true }
dictionary-learning = { git = "https://github.com/science-of-finetuning/crosscoder_learning.git", rev = "d1fd6f3fea41fc1123699cc09f4cdad47ca35160" }
tiny-dashboard = { git = "https://github.com/Butanium/tiny-activation-dashboard.git", rev = "c2729a7645ffde24df49b5fe07dda286b870f648" }

[dependency-groups]
dev = ["pytest>=8.4.2", "respx==0.22.0"]
